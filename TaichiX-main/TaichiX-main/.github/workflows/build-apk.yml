name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

defaults:
  run:
    working-directory: TaichiX-main/TaichiX-main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4. Build web
      - name: Build web assets
        run: npm run build

      # 5. Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 6. Setup Gradle oficial (garantiza el entorno de Gradle listo)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 7. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      # 7.5. Licencias Android SDK
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 8. Capacitor Android
      - name: Add Capacitor Android platform
        shell: bash
        run: |
          set -e

          npx cap add android || true

          echo "Preparing native plugin directory..."

          mkdir -p android/app/src/main/java/com/taichix/app/plugins

          if [ -f "android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java" ]; then
            cp \
              android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java \
              android/app/src/main/java/com/taichix/app/plugins/
            echo "✅ ServerNativePlugin.java copiado exitosamente"
          else
            echo "❌ ERROR: ServerNativePlugin.java no encontrado"
            exit 1
          fi

          # Crear capacitor.plugins.json
          mkdir -p android/app/src/main/assets
          cat > android/app/src/main/assets/capacitor.plugins.json << 'EOF'
          [
            {
              "pkg": "@capacitor/core",
              "classpath": "com.getcapacitor.Bridge"
            },
            {
              "pkg": "com.taichix.app",
              "classpath": "com.taichix.app.plugins.ServerNativePlugin"
            }
          ]
          EOF

          echo "✅ capacitor.plugins.json creado correctamente"

          npx cap sync android

      # 9. Reparar Wrapper si falta el JAR antes de compilar
      - name: Repair Gradle Wrapper JAR
        working-directory: TaichiX-main/TaichiX-main/android
        run: |
          mkdir -p gradle/wrapper
          gradle wrapper --gradle-version 8.2

      # 10. Build APK (Usa Gradle directo en lugar del script gradlew si falla)
      - name: Build debug APK
        working-directory: TaichiX-main/TaichiX-main/android
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      # 11. Subir APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taichix-apk
          path: TaichiX-main/TaichiX-main/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

