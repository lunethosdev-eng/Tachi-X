name: Descomprimir y Organizar ZIPs

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer y mover a la raíz
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              # Extraer en carpeta temporal
              mkdir -p temp_extracted
              unzip -o "$file" -d temp_extracted
              rm "$file"

              # Mover todo el contenido a la raíz (manejando carpetas anidadas)
              # Si hay una sola carpeta contenedora dentro del zip, mueve su interior
              INNER_DIR=$(find temp_extracted -mindepth 1 -maxdepth 1 -type d)
              if [ $(echo "$INNER_DIR" | wc -l) -eq 1 ]; then
                cp -rn $INNER_DIR/* . 2>/dev/null || true
                cp -rn $INNER_DIR/.* . 2>/dev/null || true
              else
                cp -rn temp_extracted/* . 2>/dev/null || true
                cp -rn temp_extracted/.* . 2>/dev/null || true
              fi
              
              rm -rf temp_extracted
            fi
          done

      - name: Guardar cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto: extraer contenido a la raiz" || exit 0
          git push
